<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevisScan — Devis déménagement en 2 minutes</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070B14;--s1:#0D1524;--s2:#13203A;--s3:#1A2D4A;
  --blue:#2563EB;--blue2:#3B82F6;--blue3:rgba(37,99,235,0.15);
  --green:#059669;--green2:#10B981;--amber:#D97706;--red:#DC2626;
  --purple:#7C3AED;
  --text:#EFF3FF;--t2:#94A3B8;--t3:#475569;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --f:'Outfit',sans-serif;--fm:'DM Mono',monospace;--r:14px;
}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh;overflow-x:hidden}

/* ── NAV ─────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:100;background:rgba(7,11,20,0.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-icon{width:34px;height:34px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-title{font-size:18px;font-weight:800;letter-spacing:-.4px}
.nav-title span{color:var(--blue2)}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-badge{font-size:11px;background:rgba(37,99,235,0.15);color:var(--blue2);padding:4px 10px;border-radius:20px;border:1px solid rgba(59,130,246,0.3)}
.progress{height:3px;background:rgba(255,255,255,0.05)}
.progress-bar{height:3px;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .5s ease}

/* ── BUTTONS ─────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f);font-size:15px;font-weight:600;border:none;border-radius:12px;padding:14px 24px;cursor:pointer;transition:all .18s;letter-spacing:-.2px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-primary:not(:disabled):hover{background:#1D4ED8;transform:translateY(-1px)}
.btn-success{background:var(--green);color:#fff;width:100%}
.btn-success:not(:disabled):hover{background:#047857;transform:translateY(-1px)}
.btn-ghost{background:var(--s2);color:var(--t2);border:1px solid var(--border2);width:100%}
.btn-ghost:hover{color:var(--text);border-color:var(--blue2)}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:9px;width:auto}
.btn-xs{padding:6px 12px;font-size:12px;border-radius:7px;width:auto}

/* ── TOOL STYLES ─────────────────────────────── */
.main{max-width:520px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);margin-bottom:14px}
.hero{text-align:center;padding:32px 0 8px}
.hero-badge{display:inline-block;font-size:12px;background:var(--blue3);color:var(--blue2);padding:6px 14px;border-radius:20px;border:1px solid rgba(59,130,246,0.3);margin-bottom:20px;font-weight:500}
.hero h1{font-size:38px;font-weight:900;line-height:1.1;letter-spacing:-1px;margin-bottom:12px}
.hero h1 span{color:var(--blue2)}
.hero p{color:var(--t2);font-size:15px;line-height:1.7;max-width:380px;margin:0 auto 28px}
.feat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.feat{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.feat-icon{font-size:22px;flex-shrink:0}
.feat-text{font-size:14px;font-weight:500}
.feat-sub{font-size:12px;color:var(--t2)}
.cam-area{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;width:100%;margin-bottom:14px}
.cam-area video{width:100%;height:100%;object-fit:cover;display:block}
.cam-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--t3);gap:10px;font-size:14px}
.cam-placeholder .icon{font-size:44px}
.cam-overlay{position:absolute;inset:0;pointer-events:none;border:2px dashed rgba(59,130,246,0.4);border-radius:14px}
.cam-counter{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px}
.cam-tip{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,0.8);padding:8px 16px;background:linear-gradient(0deg,rgba(0,0,0,0.8),transparent)}
.capture-btn{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.4);cursor:pointer;transition:transform .15s;flex-shrink:0}
.capture-btn:hover:not(:disabled){transform:scale(1.08)}
.capture-btn:active:not(:disabled){transform:scale(.95)}
.capture-btn:disabled{opacity:.4;cursor:not-allowed}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:2px solid rgba(59,130,246,0.5)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-del{position:absolute;top:3px;right:3px;width:18px;height:18px;background:#DC2626;border:none;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-zone{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;background:var(--s2);border:1px dashed rgba(255,255,255,0.15);border-radius:12px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;transition:border-color .2s;margin-bottom:10px}
.upload-zone:hover{border-color:var(--blue2);color:var(--blue2)}
.proc{text-align:center;padding:40px 0}
.proc-spinner{font-size:56px;animation:spin 1.5s linear infinite;display:inline-block;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.proc-steps{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:24px}
.proc-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t2);padding:10px 14px;background:var(--s1);border-radius:9px;border:1px solid var(--border)}
.proc-item.active{border-color:rgba(59,130,246,0.4);color:var(--text)}
.proc-item.done{border-color:rgba(5,150,105,0.3);color:var(--green2)}
.furn-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--s2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;transition:all .2s}
.furn-item.excluded{opacity:.45}
.furn-check{width:18px;height:18px;accent-color:var(--blue);flex-shrink:0;cursor:pointer}
.furn-name{flex:1;font-size:14px}
.furn-vol{font-family:var(--fm);font-size:11px;color:var(--t2);margin-right:6px;white-space:nowrap}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{width:28px;height:28px;background:var(--s3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.qty-btn:hover{background:var(--blue)}
.qty-val{font-family:var(--fm);font-size:13px;min-width:18px;text-align:center}
.add-select{flex:1;background:var(--s2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:13px;padding:10px 12px;outline:none}
.add-select option{background:var(--s1)}
.q-section{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.q-section-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);margin-bottom:12px}
.q-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.q-row:last-child{border-bottom:none;padding-bottom:0}
.q-label{font-size:14px;color:#CBD5E1}
.toggle{width:48px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle-knob{position:absolute;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,0.4)}
.num-ctrl{display:flex;align-items:center;gap:8px}
.num-val{font-family:var(--fm);font-size:15px;font-weight:600;min-width:36px;text-align:center}
.range-wrap{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.range-val{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--blue2)}
input[type=range]{width:100%;accent-color:var(--blue)}
.quote-hero{background:linear-gradient(135deg,#1E3A8A,#1D4ED8);border-radius:16px;padding:28px;text-align:center;margin-bottom:16px}
.quote-label{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:8px}
.quote-amount{font-family:var(--fm);font-size:52px;font-weight:500;letter-spacing:-1px;line-height:1}
.quote-sub{font-size:12px;color:rgba(255,255,255,0.5);margin-top:6px}
.quote-vol{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);border-radius:8px;padding:6px 14px;margin-top:12px;font-size:13px;color:rgba(255,255,255,0.8)}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.breakdown-row:last-child{border-bottom:none}
.breakdown-row .label{color:var(--t2)}
.breakdown-row .val{font-family:var(--fm);font-weight:500}
.info-input{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:12px 14px;outline:none;transition:border-color .2s}
.info-input:focus{border-color:var(--blue2)}
.info-input+.info-input{margin-top:8px}
.cal{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-month{font-size:15px;font-weight:700}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-day-name{text-align:center;font-size:11px;color:var(--t3);font-weight:600;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border:none;border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s;font-family:var(--f);font-weight:500;display:flex;align-items:center;justify-content:center;background:transparent}
.cal-day.avail{background:rgba(255,255,255,0.05);color:var(--text)}
.cal-day.avail:hover{background:rgba(37,99,235,0.25);color:var(--blue2)}
.cal-day.sel{background:var(--blue);color:#fff}
.cal-day.past,.cal-day.sunday,.cal-day.empty{color:var(--t3);cursor:default;background:transparent}
.booked-confirm{background:rgba(5,150,105,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:14px;padding:20px;text-align:left;margin:20px 0}
.booked-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.booked-row:last-child{border-bottom:none}
.booked-row .k{color:var(--t2)}
.booked-row .v{font-weight:600}
.gap8{display:flex;flex-direction:column;gap:8px}
.flex-row{display:flex;gap:10px}

/* ── DASHBOARD LAYOUT ────────────────────────── */
#dashboard{display:none;min-height:100vh}
.dash-layout{display:flex;min-height:calc(100vh - 57px)}
.dash-sidebar{width:220px;background:var(--s1);border-right:1px solid var(--border);padding:20px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.dash-main{flex:1;padding:28px 32px;overflow-y:auto;max-height:calc(100vh - 57px);overflow-x:hidden}
.dash-nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:all .2s;font-size:14px;font-weight:500;color:var(--t2);border:none;background:transparent;width:100%;text-align:left}
.dash-nav-item:hover{background:var(--s2);color:var(--text)}
.dash-nav-item.active{background:var(--blue3);color:var(--blue2);border:1px solid rgba(59,130,246,0.2)}
.dash-nav-icon{font-size:18px;flex-shrink:0}
.dash-company{padding:12px;background:var(--s2);border-radius:10px;margin-bottom:16px;border:1px solid var(--border)}
.dash-company-name{font-size:13px;font-weight:700;margin-bottom:2px}
.dash-company-plan{font-size:11px;color:var(--t2)}
.dash-logout{margin-top:auto;width:100%;padding:10px 14px;background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.15);border-radius:10px;color:var(--red);font-size:13px;font-weight:500;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;font-family:var(--f)}
.dash-logout:hover{background:rgba(220,38,38,0.15)}

/* ── DASHBOARD VIEWS ─────────────────────────── */
.dash-view{display:none}
.dash-view.active{display:block}
.dash-page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.dash-page-sub{font-size:14px;color:var(--t2);margin-bottom:24px}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.kpi-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-color,var(--blue))}
.kpi-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);margin-bottom:10px}
.kpi-val{font-family:var(--fm);font-size:32px;font-weight:500;line-height:1;margin-bottom:6px}
.kpi-trend{font-size:12px;color:var(--t2)}
.kpi-trend.up{color:var(--green2)}
.kpi-trend.down{color:var(--red)}
.kpi-icon{position:absolute;top:16px;right:16px;font-size:28px;opacity:.25}

/* QUOTE TABLE */
.dash-table{width:100%;border-collapse:collapse;font-size:13px}
.dash-table th{text-align:left;padding:10px 14px;color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.dash-table td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
.dash-table tr:hover td{background:rgba(255,255,255,0.02);cursor:pointer}
.dash-table tr:last-child td{border-bottom:none}
.dash-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.dash-card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.dash-card-title{font-size:14px;font-weight:700}

/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em}
.badge-generated{background:rgba(37,99,235,0.15);color:var(--blue2)}
.badge-sent{background:rgba(217,119,6,0.15);color:#F59E0B}
.badge-accepted{background:rgba(5,150,105,0.15);color:var(--green2)}
.badge-booked{background:rgba(124,58,237,0.15);color:#A78BFA}
.badge-refused{background:rgba(220,38,38,0.12);color:#F87171}
.badge-cancelled{background:rgba(255,255,255,0.06);color:var(--t2)}

/* FILTER TABS */
.filter-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--s2);padding:4px;border-radius:10px;width:fit-content}
.filter-tab{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:var(--f);transition:all .2s}
.filter-tab.active{background:var(--blue);color:#fff}

/* CHARTS */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bar{width:100%;background:var(--blue3);border-radius:4px 4px 0 0;border:1px solid rgba(59,130,246,0.3);transition:height .5s ease;min-height:4px}
.bar-label{font-size:10px;color:var(--t3);white-space:nowrap}
.bar-val{font-size:10px;color:var(--t2);font-family:var(--fm)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:580px;max-height:85vh;overflow-y:auto}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--s1);z-index:1}
.modal-title{font-size:17px;font-weight:800}
.modal-close{width:32px;height:32px;background:var(--s2);border:none;border-radius:8px;color:var(--t2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:24px}

/* SETTINGS */
.settings-section{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.settings-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.settings-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.settings-row:last-child{margin-bottom:0}
.settings-label{font-size:14px;color:var(--text)}
.settings-sub{font-size:12px;color:var(--t2);margin-top:2px}
.settings-input{background:var(--s2);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-family:var(--f);font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s;width:200px}
.settings-input:focus{border-color:var(--blue2)}
.settings-input-full{width:100%;margin-top:6px}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}

/* LOGIN */
.login-wrap{min-height:calc(100vh - 57px);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--s1);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:28px}
.login-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--t2);text-align:center;margin-bottom:28px}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.login-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t2)}
.login-input{background:var(--s2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:15px;padding:13px 16px;outline:none;transition:border-color .2s;width:100%}
.login-input:focus{border-color:var(--blue2)}
.login-hint{font-size:12px;color:var(--t3);text-align:center;margin-top:16px;padding:12px;background:var(--s2);border-radius:8px}
.login-error{color:#F87171;font-size:13px;text-align:center;margin-bottom:12px;min-height:20px}

/* CALENDAR DASHBOARD */
.dash-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dash-cal-day{min-height:64px;background:var(--s2);border-radius:8px;padding:6px;position:relative;border:1px solid var(--border)}
.dash-cal-day.today{border-color:rgba(59,130,246,0.5)}
.dash-cal-day-num{font-size:12px;font-weight:600;color:var(--t2)}
.dash-cal-day.today .dash-cal-day-num{color:var(--blue2)}
.dash-cal-event{font-size:10px;background:rgba(37,99,235,0.2);color:var(--blue2);border-radius:4px;padding:2px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-cal-event.purple{background:rgba(124,58,237,0.2);color:#A78BFA}

/* RESPONSIVE */
@media(max-width:900px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .dash-sidebar{width:60px;padding:12px 8px}
  .dash-nav-label{display:none}
  .dash-company,.dash-logout span{display:none}

// ── OVERVIEW ─────────────────────────────────
function renderOverview(el){
  var all=QUOTES;
  var now=new Date();
  var thisMonth=all.filter(function(q){
    var parts=q.createdAt.split('/');
    return parseInt(parts[1])===now.getMonth()+1&&parseInt(parts[2])===now.getFullYear();
  });
  var confirmed=all.filter(function(q){return q.status==='accepted'||q.status==='booked';});
  var pending=all.filter(function(q){return q.status==='generated'||q.status==='sent';});
  var convRate=all.length>0?Math.round(confirmed.length/all.length*100):0;
  var caConfirmed=confirmed.reduce(function(s,q){return s+q.ttc;},0);
  var nb=function(n){return n.toLocaleString('fr-FR');};

  // Monthly bars (last 6 months)
  var monthLabels=[],monthVals=[];
  for(var i=5;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    monthLabels.push(['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'][d.getMonth()]);
    var count=all.filter(function(q){
      var p=q.createdAt.split('/');
      return parseInt(p[1])-1===d.getMonth()&&parseInt(p[2])===d.getFullYear();
    }).length;
    monthVals.push(count);
  }
  var maxV=Math.max.apply(null,monthVals)||1;

  el.innerHTML=
  '<div class="dash-page-title">Bonjour 👋</div>'+
  '<div class="dash-page-sub">Voici l\'activité de <strong>'+COMPANY.name+'</strong></div>'+

  '<div class="kpi-grid">'+
  kpiCard('Devis ce mois','--blue','📋',thisMonth.length,'devis générés',null)+
  kpiCard('Taux de conversion','--green','✅',convRate+'%','des devis acceptés',convRate>=30?'up':'down')+
  kpiCard('CA confirmé','--purple','💶',nb(caConfirmed)+' €','commandes validées',null)+
  kpiCard('En attente','--amber','⏳',pending.length,'devis sans réponse',null)+
  '</div>'+

  '<div style="display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:20px">'+

  '<div class="dash-card">'+
  '<div class="dash-card-header"><div class="dash-card-title">Devis des 6 derniers mois</div></div>'+
  '<div style="padding:16px 20px">'+
  '<div class="bar-chart">'+
  monthVals.map(function(v,i){
    var h=Math.max(8,Math.round(v/maxV*100));
    return '<div class="bar-col"><div class="bar-val">'+v+'</div><div class="bar" style="height:'+h+'px;background:rgba(37,99,235,'+(0.3+v/maxV*0.5)+');border-color:rgba(59,130,246,'+(0.3+v/maxV*0.5)+')"></div><div class="bar-label">'+monthLabels[i]+'</div></div>';
  }).join('')+
  '</div></div></div>'+

  '<div class="dash-card">'+
  '<div class="dash-card-header"><div class="dash-card-title">Répartition statuts</div></div>'+
  '<div style="padding:16px 20px;display:flex;flex-direction:column;gap:10px">'+
  [['Générés','generated',all.filter(function(q){return q.status==='generated';}).length],
   ['Envoyés','sent',all.filter(function(q){return q.status==='sent';}).length],
   ['Acceptés','accepted',all.filter(function(q){return q.status==='accepted';}).length],
   ['Réservés','booked',all.filter(function(q){return q.status==='booked';}).length],
   ['Refusés','refused',all.filter(function(q){return q.status==='refused';}).length]
  ].map(function(r){
    var pct=all.length>0?Math.round(r[2]/all.length*100):0;
    return '<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--t2)">'+r[0]+'</span><span>'+r[2]+'</span></div>'+
    '<div style="height:6px;background:var(--s2);border-radius:3px"><div style="height:6px;border-radius:3px;width:'+pct+'%;background:var(--blue);transition:width .5s"></div></div></div>';
  }).join('')+
  '</div></div></div>'+

  '<div class="dash-card">'+
  '<div class="dash-card-header"><div class="dash-card-title">Derniers devis</div><button class="btn btn-ghost btn-xs" onclick="showView(\'quotes\')">Voir tout →</button></div>'+
  '<table class="dash-table"><thead><tr><th>Client</th><th>Montant</th><th>Date</th><th>Statut</th><th></th></tr></thead><tbody>'+
  all.slice(0,6).map(function(q){
    return '<tr onclick="openQuoteModal(\''+q.id+'\')"><td><div style="font-weight:600;font-size:13px">'+q.client.name+'</div><div style="font-size:11px;color:var(--t2)">'+q.client.email+'</div></td>'+
    '<td><span style="font-family:var(--fm);font-size:13px;font-weight:600">'+q.ttc.toLocaleString('fr-FR')+' €</span></td>'+
    '<td style="color:var(--t2);font-size:12px">'+q.createdAt+'</td>'+
    '<td>'+statusBadge(q.status)+'</td>'+
    '<td><button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();openQuoteModal(\''+q.id+'\')">Voir</button></td></tr>';
  }).join('')+
  '</tbody></table></div>';
}

function kpiCard(label,colorVar,icon,val,sub,trend){

// ── CALENDAR ─────────────────────────────────
function renderDashCalendar(el){
  var now=new Date();
  var yr=now.getFullYear(), mo=now.getMonth();
  var months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  var dim=new Date(yr,mo+1,0).getDate();
  var fd=new Date(yr,mo,1).getDay();
  var offset=fd===0?6:fd-1;

  var bookedDays={};
  QUOTES.forEach(function(q){
    if(q.date&&(q.status==='booked'||q.status==='accepted')){
      var parts=q.date.split('/');
      if(parseInt(parts[1])-1===mo&&parseInt(parts[2])===yr){
        var d=parseInt(parts[0]);
        if(!bookedDays[d]) bookedDays[d]=[];
        bookedDays[d].push(q);
      }
    }
  });

  var cells=[];
  for(var i=0;i<offset;i++) cells.push('<div></div>');
  for(var d=1;d<=dim;d++){
    var isToday=d===now.getDate();
    var events=bookedDays[d]||[];
    cells.push('<div class="dash-cal-day'+(isToday?' today':'')+'">'+
      '<div class="dash-cal-day-num">'+d+'</div>'+
      events.slice(0,2).map(function(q){
        return '<div class="dash-cal-event '+(q.status==='booked'?'purple':'')+'">'+q.client.name.split(' ')[0]+'</div>';
      }).join('')+
      (events.length>2?'<div style="font-size:10px;color:var(--t2)">+'+( events.length-2)+' autre'+(events.length>3?'s':'')+'</div>':'')+
    '</div>');
  }

  var upcoming=QUOTES.filter(function(q){
    if(!q.date||(q.status!=='booked'&&q.status!=='accepted')) return false;
    var p=q.date.split('/');
    var qd=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    return qd>=now;
  }).sort(function(a,b){
    var pa=a.date.split('/'),pb=b.date.split('/');
    return new Date(parseInt(pa[2]),parseInt(pa[1])-1,parseInt(pa[0]))-new Date(parseInt(pb[2]),parseInt(pb[1])-1,parseInt(pb[0]));
  }).slice(0,5);

  el.innerHTML=

function calcQuote(){
  var m3=0,heavy=0;
  S.furniture.filter(function(f){return f.on;}).forEach(function(f){
    var db=FURNITURE[f.name];m3+=(db?db.v:0.3)*f.qty;
    if(db&&db.h) heavy+=f.qty;
  });
  var p=m3*PRICING.perM3;
  if(!S.q.lift&&S.q.floor>0) p+=S.q.floor*PRICING.floorSurch;
  if(!S.q.dlift&&S.q.dfloor>0) p+=S.q.dfloor*PRICING.floorSurch;
  if(S.q.dist>50) p+=(S.q.dist-50)*PRICING.longRate;
  p+=heavy*PRICING.heavySurch;
  if(S.q.disassem) p+=PRICING.disassem;
  if(S.q.fragile) p+=PRICING.fragile;
  p=Math.max(p,PRICING.min);
  var ht=Math.round(p),tva=Math.round(p*.2),ttc=Math.round(p*1.2);
  S.quote={m3:Math.round(m3*10)/10,ht:ht,tva:tva,ttc:ttc,
    bkd:{vol:Math.round(m3*PRICING.perM3),
      floor:(!S.q.lift&&S.q.floor>0?S.q.floor*PRICING.floorSurch:0)+(!S.q.dlift&&S.q.dfloor>0?S.q.dfloor*PRICING.floorSurch:0),
      dist:S.q.dist>50?Math.round((S.q.dist-50)*PRICING.longRate):0,
      heavy:heavy*PRICING.heavySurch,
      opts:(S.q.disassem?PRICING.disassem:0)+(S.q.fragile?PRICING.fragile:0)}};
}

  .catch(function(){alert('Caméra non accessible.\nUtilisez le bouton "Importer depuis ma galerie".');});
}

function captureFrame(){
  var v=document.getElementById('camVid'),c=document.getElementById('cv');
  if(!v||!v.videoWidth) return;
  c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  var d=c.toDataURL('image/jpeg',.82);
  if(S.frames.length<8){S.frames.push(d);render();}
}
function handleUpload(files){
  Array.from(files).slice(0,8-S.frames.length).forEach(function(f){
    var r=new FileReader();
    r.onload=function(ev){if(S.frames.length<8){S.frames.push(ev.target.result);render();}};
    r.readAsDataURL(f);
  });
}

function analyzeWithClaude(b64arr){
  var content=b64arr.map(function(b){return{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b}};});
  content.push({type:'text',text:'Tu es un expert déménageur. Analyse ces photos et liste TOUS les meubles et objets volumineux visibles.\nRéponds UNIQUEMENT avec un objet JSON valide (pas de backticks, pas de texte avant/après) :\n{"items":[{"name":"Canapé 3 places","qty":1},{"name":"Télévision","qty":1}]}'});
  return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:content}]})})
  .then(function(res){return res.json();})
  .then(function(d){
    var txt=(d.content||[]).map(function(c){return c.text||'';}).join('').trim().replace(/```json|```/g,'').trim();
    return JSON.parse(txt);
  });
}

function runAnalysis(){
  S.step=2;S.procStep=0;render();
  var b64s=S.frames.map(function(f){return f.split(',')[1];});
  var batches=[];for(var i=0;i<b64s.length;i+=4) batches.push(b64s.slice(i,i+4));
  var all=[];var chain=Promise.resolve();
  batches.forEach(function(batch,idx){
    chain=chain.then(function(){S.procStep=idx+1;render();return analyzeWithClaude(batch);})
    .then(function(r){if(r&&r.items) r.items.forEach(function(it){var ex=all.find(function(x){return x.name===it.name;});if(ex)ex.qty+=(it.qty||1);else all.push({name:it.name,qty:it.qty||1});});})
    .catch(function(e){console.warn('err',e);});
  });
  chain.then(function(){
    S.furniture=all.map(function(it){
      var dbk=Object.keys(FURNITURE).find(function(k){return k.toLowerCase().indexOf(it.name.toLowerCase().split(' ')[0])!==-1||it.name.toLowerCase().indexOf(k.toLowerCase().split(' ')[0])!==-1;});
      return{name:dbk||it.name,qty:it.qty,on:true,v:FURNITURE[dbk]?FURNITURE[dbk].v:0.3};
    });
    if(S.furniture.length===0) S.furniture=[{name:'Canapé 3 places',qty:1,on:true,v:1.5},{name:'Lit double 140',qty:1,on:true,v:1.2}];
    S.procStep=99;render();setTimeout(function(){S.step=3;render();},700);
  });
}

  document.getElementById('progBar').style.width=PROG[S.step]+'%';
  if(S.step===0) renderIntro(app);
  else if(S.step===1) renderCamera(app);
  else if(S.step===2) renderProcessing(app);
  else if(S.step===3) renderFurniture(app);
  else if(S.step===4) renderQuestionnaire(app);
  else if(S.step===5) renderQuote(app);
  else if(S.step===6) renderBooking(app);
}

function renderIntro(app){
  app.innerHTML='<div class="hero"><div class="hero-badge">⚡ Devis instantané par IA</div><h1>Votre devis de<br><span>déménagement</span><br>en 2 minutes</h1><p>Filmez vos pièces. Notre IA détecte tous vos meubles et génère un devis précis et signable immédiatement.</p></div><div class="feat-list">'+
  [['📸','Filmez vos pièces','Caméra ou galerie photo'],['🤖','IA identifie tout','Détection automatique des meubles'],['📋','Devis PDF immédiat','Précis, modifiable, téléchargeable'],['📅','Réservation en ligne','Calendrier + confirmation instantanée']]
  .map(function(x){return '<div class="feat"><div class="feat-icon">'+x[0]+'</div><div><div class="feat-text">'+x[1]+'</div><div class="feat-sub">'+x[2]+'</div></div></div>';}).join('')+
  '</div><button class="btn btn-primary" onclick="S.step=1;render();startCam()">Commencer mon devis →</button>';
}

function renderCamera(app){
  var n=S.frames.length;
  app.innerHTML='<div style="margin-bottom:20px"><h2 style="font-size:22px;font-weight:800;margin-bottom:6px">📸 Photographiez vos pièces</h2><p style="color:var(--t2);font-size:13px">'+n+'/8 photos capturées. Balayez chaque pièce.</p></div>'+
  '<div class="cam-area"><video id="camVid" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:'+(S.stream?'block':'none')+'"></video>'+
  '<div class="cam-placeholder" style="'+(S.stream?'display:none':'')+'"><div class="icon">📷</div><div>Activez la caméra</div></div>'+
  '<div class="cam-overlay"></div><div class="cam-counter">'+n+'/8</div>'+
  (S.stream?'<div class="cam-tip">Cadrez vos meubles et appuyez sur ⚪</div>':'')+
  '</div>'+
  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+
  (S.stream?'<button class="btn btn-ghost btn-sm" onclick="stopCam();render()">Arrêter</button><button class="capture-btn" onclick="captureFrame()" '+(n>=8?'disabled':'')+'></button><div style="font-size:12px;color:var(--t2)">Appuyez pour<br>capturer</div>'
  :'<button class="btn btn-primary" onclick="startCam()">📷 Activer la caméra</button>')+
  '</div>'+
  '<label class="upload-zone">📂 Importer depuis ma galerie<input type="file" accept="image/*" multiple style="display:none" onchange="handleUpload(this.files);this.value=\'\'"></label>'+
  (n>0?'<div class="thumbs">'+S.frames.map(function(f,i){return '<div class="thumb"><img src="'+f+'"><button class="thumb-del" onclick="S.frames.splice('+i+',1);render()">×</button></div>';}).join('')+'</div>':'')+
  '<div class="flex-row"><button class="btn btn-ghost btn-sm" onclick="stopCam();S.step=0;render()">← Retour</button>'+
  '<button class="btn btn-primary" onclick="if(S.frames.length>0){stopCam();runAnalysis();}else{alert(\'Ajoutez au moins 1 photo\');}" style="flex:2" '+(n===0?'disabled':'')+'>Analyser '+n+' photo'+(n>1?'s':'')+' →</button></div>';
  if(S.stream){var v=document.getElementById('camVid');if(v&&!v.srcObject)v.srcObject=S.stream;}
}

function renderProcessing(app){
  var ps=S.procStep;
  app.innerHTML='<div class="proc"><div class="proc-spinner">⚙️</div><h2 style="font-size:22px;font-weight:800;margin-bottom:6px">Analyse IA en cours...</h2><p style="color:var(--t2);font-size:14px">Identification automatique des meubles</p>'+
  '<div class="proc-steps">'+
  [{l:'Envoi de '+S.frames.length+' photo(s)',done:ps>0,a:ps===0},
   {l:'Détection des meubles...',done:ps>1,a:ps===1},
   {l:'Calcul des volumes',done:ps>2,a:ps===2},
   {l:'Inventaire prêt !',done:ps>=99,a:ps===99}]
  .map(function(i){return '<div class="proc-item '+(i.done?'done':i.a?'active':'')+'">'+( i.done?'✅':i.a?'⏳':'⬜')+' '+i.l+'</div>';}).join('')+
  '</div></div>';
}

function renderFurniture(app){
  var total=S.furniture.filter(function(f){return f.on;}).reduce(function(s,f){return s+(FURNITURE[f.name]?FURNITURE[f.name].v:0.3)*f.qty;},0);
  app.innerHTML='<div style="margin-bottom:16px"><h2 style="font-size:22px;font-weight:800;margin-bottom:6px">🛋️ Inventaire détecté</h2><p style="color:var(--t2);font-size:13px">Décochez ce qui n\'est pas à déménager. Ajustez les quantités.</p></div>'+
  '<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center">'+
  '<div style="font-size:13px;color:var(--t2)">'+S.furniture.filter(function(f){return f.on;}).length+' meubles inclus</div>'+
  '<div style="font-family:var(--fm);font-size:15px;font-weight:600;color:var(--blue2)">'+Math.round(total*10)/10+' m³</div></div></div>'+
  (S.furniture.length===0?'<div style="text-align:center;color:var(--t2);padding:20px;background:var(--s1);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;font-size:14px">⚠️ Aucun meuble détecté — ajoutez-les manuellement</div>':'')+
  S.furniture.map(function(f,i){
    var vol=((FURNITURE[f.name]?FURNITURE[f.name].v:0.3)*f.qty).toFixed(2);
    return '<div class="furn-item '+(f.on?'':'excluded')+'">'+
    '<input class="furn-check" type="checkbox" '+(f.on?'checked':'')+' onchange="S.furniture['+i+'].on=this.checked;render()">'+
    '<div class="furn-name">'+f.name+'</div><div class="furn-vol">'+vol+' m³</div>'+
    '<div class="qty-ctrl"><button class="qty-btn" onclick="if(S.furniture['+i+'].qty>1){S.furniture['+i+'].qty--;render()}">−</button>'+
    '<div class="qty-val">'+f.qty+'</div>'+
    '<button class="qty-btn" onclick="S.furniture['+i+'].qty++;render()">+</button></div></div>';
  }).join('')+
  (S.showAddRow?'<div style="display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--s2);border:1px solid var(--border2);border-radius:12px;margin-top:8px">'+
  '<select class="add-select" onchange="S.addName=this.value"><option value="">Choisir...</option>'+
  Object.keys(FURNITURE).map(function(k){return '<option value="'+k+'"'+(S.addName===k?' selected':'')+'>'+k+'</option>';}).join('')+'</select>'+
  '<div class="flex-row" style="align-items:center">'+
  '<button class="qty-btn" onclick="if(S.addQty>1){S.addQty--;document.getElementById(\'aqv\').textContent=S.addQty}">−</button>'+
  '<span id="aqv" style="font-family:var(--fm);font-size:14px;min-width:24px;text-align:center">'+S.addQty+'</span>'+
  '<button class="qty-btn" onclick="S.addQty++;document.getElementById(\'aqv\').textContent=S.addQty">+</button>'+
  '<button class="btn btn-primary btn-sm" style="flex:1" onclick="if(S.addName){S.furniture.push({name:S.addName,qty:S.addQty,on:true,v:FURNITURE[S.addName]?FURNITURE[S.addName].v:0.3});S.addName=\'\';S.addQty=1;S.showAddRow=false;render();}">Ajouter</button>'+
  '<button class="btn btn-ghost btn-sm" onclick="S.showAddRow=false;render()">✕</button></div></div>'
  :'<button onclick="S.showAddRow=true;render()" style="width:100%;padding:12px;background:var(--s2);border:1px dashed rgba(255,255,255,0.12);border-radius:12px;color:var(--t2);cursor:pointer;font-family:var(--f);font-size:13px;font-weight:500;margin-top:8px">+ Ajouter un meuble manuellement</button>')+
  '<div class="flex-row" style="margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="S.step=1;render()">← Retour</button>'+
  '<button class="btn btn-primary" style="flex:2" onclick="S.step=4;render()">Continuer ('+S.furniture.filter(function(f){return f.on;}).length+') →</button></div>';
}

function renderQuestionnaire(app){
  var q=S.q;
  function tog(l,k){var v=q[k];return '<div class="q-row"><div class="q-label">'+l+'</div><button class="toggle" style="background:'+(v?'var(--blue)':'rgba(255,255,255,0.1)')+'" onclick="S.q[\''+k+'\']=!S.q[\''+k+'\'];render()"><div class="toggle-knob" style="left:'+(v?'25':'3')+'px"></div></button></div>';}
  function num(l,k){var v=q[k];return '<div class="q-row"><div class="q-label">'+l+'</div><div class="num-ctrl"><button class="qty-btn" onclick="if(S.q[\''+k+'\']>0){S.q[\''+k+'\']--;render()}">−</button><div class="num-val">'+v+'</div><button class="qty-btn" onclick="S.q[\''+k+'\']++;render()">+</button></div></div>';}
  app.innerHTML='<div style="margin-bottom:20px"><h2 style="font-size:22px;font-weight:800;margin-bottom:6px">📝 Informations complémentaires</h2><p style="color:var(--t2);font-size:13px">Ces données affinent votre devis.</p></div>'+
  '<div class="q-section"><div class="q-section-title">📍 Adresse de départ</div>'+num('Étage actuel','floor')+tog('Ascenseur disponible','lift')+'</div>'+
  '<div class="q-section"><div class="q-section-title">🏁 Adresse de destination</div>'+num('Étage destination','dfloor')+tog('Ascenseur disponible','dlift')+'</div>'+
  '<div class="q-section"><div class="q-section-title">🚛 Distance</div><div class="q-row" style="flex-direction:column;align-items:flex-start;gap:8px"><div class="q-label">Distance estimée</div><div class="range-wrap" style="width:100%"><div style="display:flex;justify-content:space-between"><div class="range-val" id="distVal">'+q.dist+' km</div><div style="font-size:12px;color:var(--t2)" id="distNote">'+(q.dist<=50?'Inclus':'Supplément')+'</div></div><input type="range" min="1" max="500" step="5" value="'+q.dist+'" oninput="S.q.dist=parseInt(this.value);document.getElementById(\'distVal\').textContent=this.value+\' km\';document.getElementById(\'distNote\').textContent=parseInt(this.value)<=50?\'Inclus\':\'Supplément\'"></div></div></div>'+
  '<div class="q-section"><div class="q-section-title">🔧 Options</div>'+tog('Démontage / remontage','disassem')+tog('Objets fragiles','fragile')+'</div>'+
  '<div class="flex-row" style="margin-top:20px"><button class="btn btn-ghost btn-sm" onclick="S.step=3;render()">← Retour</button><button class="btn btn-primary" style="flex:2" onclick="calcQuote();S.step=5;render()">Calculer mon devis →</button></div>';
}

function renderQuote(app){
  var qt=S.quote;var nb=function(n){return n.toLocaleString('fr-FR');};
  var bkd=qt.bkd;
  var rows=[];rows.push(['Volume & manutention',bkd.vol]);
  if(bkd.floor>0)rows.push(['Surcharge étages',bkd.floor]);
  if(bkd.dist>0)rows.push(['Supplément distance',bkd.dist]);
  if(bkd.heavy>0)rows.push(['Objets lourds',bkd.heavy]);
  if(bkd.opts>0)rows.push(['Options',bkd.opts]);
  app.innerHTML='<div style="margin-bottom:16px"><h2 style="font-size:22px;font-weight:800;margin-bottom:4px">📋 Votre devis</h2><p style="color:var(--t2);font-size:12px">Émis le '+new Date().toLocaleDateString('fr-FR')+' · Valable 30 jours</p></div>'+
  '<div class="quote-hero"><div class="quote-label">Total TTC</div><div class="quote-amount">'+nb(qt.ttc)+' €</div>'+
  '<div class="quote-sub">'+nb(qt.ht)+' € HT + TVA 20% ('+nb(qt.tva)+' €)</div>'+
  '<div class="quote-vol">📦 Volume estimé : '+qt.m3+' m³</div></div>'+
  '<div class="card" style="margin-bottom:12px"><div class="card-title">Détail HT</div>'+rows.map(function(r){return '<div class="breakdown-row"><div class="label">'+r[0]+'</div><div class="val">'+nb(r[1])+' €</div></div>';}).join('')+'</div>'+
  '<div class="card" style="margin-bottom:16px"><div class="card-title">Vos coordonnées</div>'+
  '<input class="info-input" type="text" placeholder="Nom complet" value="'+S.client.name+'" oninput="S.client.name=this.value">'+
  '<input class="info-input" type="email" placeholder="Email" value="'+S.client.email+'" oninput="S.client.email=this.value">'+
  '<input class="info-input" type="tel" placeholder="Téléphone" value="'+S.client.phone+'" oninput="S.client.phone=this.value"></div>'+
  '<div class="gap8"><button class="btn btn-success" onclick="S.step=6;render()">📅 Réserver ma date →</button>'+
  '<button class="btn btn-ghost" onclick="downloadQuotePDF()">📄 Télécharger le devis PDF</button></div>';
}

function renderBooking(app){
  if(S.booked){renderBooked(app);return;}
  var today=new Date();var yr=S.calYear,mo=S.calMonth;
  var months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var days=['Lu','Ma','Me','Je','Ve','Sa','Di'];
  var dim=new Date(yr,mo+1,0).getDate();var fd=new Date(yr,mo,1).getDay();var offset=fd===0?6:fd-1;
  var cells=[];for(var i=0;i<offset;i++) cells.push('<div class="cal-day empty"></div>');
  for(var d=1;d<=dim;d++){
    var date=new Date(yr,mo,d);var diff=(date-today)/86400000;var dow=date.getDay();
    var fmt=String(d).padStart(2,'0')+'/'+String(mo+1).padStart(2,'0')+'/'+yr;
    var sel=S.date===fmt;var cls='cal-day';
    if(sel)cls+=' sel';else if(dow===0||diff<2||diff>120)cls+=dow===0?' sunday':' past';else cls+=' avail';
    var oc=(cls.indexOf('avail')!==-1||sel)?'onclick="S.date=\''+fmt+'\';render()"':'';
    cells.push('<div class="'+cls+'" '+oc+'>'+d+'</div>');
  }
  app.innerHTML='<div style="margin-bottom:20px"><h2 style="font-size:22px;font-weight:800;margin-bottom:6px">📅 Choisissez votre date</h2></div>'+
  '<div class="cal"><div class="cal-nav"><button class="qty-btn" onclick="if(S.calMonth===0){S.calMonth=11;S.calYear--}else S.calMonth--;render()">‹</button><div class="cal-month">'+months[mo]+' '+yr+'</div><button class="qty-btn" onclick="if(S.calMonth===11){S.calMonth=0;S.calYear++}else S.calMonth++;render()">›</button></div>'+
  '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px">'+days.map(function(d){return '<div class="cal-day-name">'+d+'</div>';}).join('')+'</div>'+
  '<div class="cal-grid">'+cells.join('')+'</div></div>'+
  (S.date?'<div style="margin-top:14px;padding:12px;background:rgba(37,99,235,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:12px;font-size:14px">📅 '+S.date+' sélectionné</div>':'')+
  '<div class="flex-row" style="margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="S.step=5;render()">← Retour</button>'+
  '<button class="btn btn-success" style="flex:2" '+(S.date?'':'disabled')+' onclick="S.booked=true;saveQuoteToStorage();render()">'+(S.date?'Confirmer le '+S.date:'Sélectionnez une date')+'</button></div>';
}

function renderBooked(app){
  var qt=S.quote;var nb=function(n){return n.toLocaleString('fr-FR');};
  app.innerHTML='<div style="text-align:center;padding:20px 0"><div style="font-size:64px;margin-bottom:16px">🎉</div>'+
  '<h2 style="font-size:26px;font-weight:900;margin-bottom:8px">Réservation confirmée !</h2>'+
  '<p style="color:var(--t2);font-size:14px">Votre déménageur vous contactera sous 24h.</p></div>'+
  '<div class="booked-confirm">'+
  '<div class="booked-row"><div class="k">📅 Date</div><div class="v">'+S.date+'</div></div>'+
  '<div class="booked-row"><div class="k">💶 Montant TTC</div><div class="v">'+nb(qt.ttc)+' €</div></div>'+
  '<div class="booked-row"><div class="k">📦 Volume</div><div class="v">'+qt.m3+' m³</div></div>'+
  '<div class="booked-row"><div class="k">👤 Client</div><div class="v">'+(S.client.name||'—')+'</div></div></div>'+
  '<div class="gap8"><button class="btn btn-ghost" onclick="downloadQuotePDF()">📄 Télécharger le devis PDF</button>'+
  '<button class="btn btn-primary" onclick="resetApp()">➕ Nouveau devis</button></div>';
}

// ═══════════════════════════════════════════════
// SAVE QUOTE → DASHBOARD
// ═══════════════════════════════════════════════
function saveQuoteToStorage(){
  if(!S.quote) return;
  addQuote({
    client:S.client,ttc:S.quote.ttc,ht:S.quote.ht,m3:S.quote.m3,
    status:'booked',date:S.date,dist:S.q.dist,floor:S.q.floor,
    furniture:S.furniture.filter(function(f){return f.on;}),bkd:S.quote.bkd
  });
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
render();
</script>
</body>
</html>
